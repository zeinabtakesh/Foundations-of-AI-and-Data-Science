<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">AND can be separated by one line; XOR cannot</title>
  <desc id="desc">Two side-by-side plots show the four binary input pairs. For AND, only one-one is output one, and a diagonal line separates it from the three zeros. For XOR, zero-one and one-zero are output one on opposite corners, so a single line cannot separate both from the zeros.</desc>
  <rect width="800" height="390" fill="#f5f9f7"/>
  <g font-family="Arial, sans-serif" fill="#172b2b">
    <text x="205" y="42" text-anchor="middle" font-size="22" font-weight="700">AND</text>
    <text x="595" y="42" text-anchor="middle" font-size="22" font-weight="700">XOR</text>
    <text x="205" y="68" text-anchor="middle" font-size="15">One line separates 1 from 0</text>
    <text x="595" y="68" text-anchor="middle" font-size="15">No single line separates them</text>
  </g>
  <g stroke="#9bb6af" stroke-width="2" fill="none">
    <path d="M75 307H333M75 307V104"/>
    <path d="M465 307H723M465 307V104"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#405b56" text-anchor="middle">
    <text x="125" y="331">0</text><text x="265" y="331">1</text>
    <text x="515" y="331">0</text><text x="655" y="331">1</text>
    <text x="205" y="356">input 1</text><text x="595" y="356">input 1</text>
    <text x="57" y="267">0</text><text x="57" y="147">1</text>
    <text x="447" y="267">0</text><text x="447" y="147">1</text>
    <text x="48" y="212" transform="rotate(-90 48 212)">input 2</text>
    <text x="438" y="212" transform="rotate(-90 438 212)">input 2</text>
  </g>
  <path d="M165 105L350 264" stroke="#a34a35" stroke-width="3" fill="none"/>
  <path d="M555 105L740 264" stroke="#a34a35" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <g fill="#dcece8" stroke="#176d68" stroke-width="2">
      <circle cx="125" cy="260" r="27"/><circle cx="265" cy="260" r="27"/><circle cx="125" cy="140" r="27"/>
      <circle cx="515" cy="260" r="27"/><circle cx="655" cy="140" r="27"/>
    </g>
    <g fill="#fbe3d9" stroke="#a34a35" stroke-width="2">
      <circle cx="265" cy="140" r="27"/>
      <circle cx="655" cy="260" r="27"/><circle cx="515" cy="140" r="27"/>
    </g>
    <g fill="#176d68">
      <text x="125" y="260">0</text><text x="265" y="260">0</text><text x="125" y="140">0</text>
      <text x="515" y="260">0</text><text x="655" y="140">0</text>
    </g>
    <g fill="#a34a35">
      <text x="265" y="140">1</text><text x="655" y="260">1</text><text x="515" y="140">1</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#405b56" text-anchor="middle">
    <text x="205" y="382">Only (1, 1) gives 1</text>
    <text x="595" y="382">The 1s sit in opposite corners</text>
  </g>
</svg>
