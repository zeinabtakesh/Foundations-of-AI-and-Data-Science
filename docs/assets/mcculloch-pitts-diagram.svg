<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="title description">
  <title id="title">A simplified McCulloch–Pitts neuron</title>
  <desc id="description">Two binary inputs each with weight one flow into a sum. The sum is compared with a threshold to produce a binary output.</desc>
  <rect width="920" height="250" fill="#f3f8f6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="90" y="72" fill="#176d68" font-size="19" font-weight="700">INPUTS</text>
    <rect x="50" y="92" width="80" height="46" rx="3" fill="#fff" stroke="#9dbdb5" stroke-width="2"/>
    <rect x="50" y="156" width="80" height="46" rx="3" fill="#fff" stroke="#9dbdb5" stroke-width="2"/>
    <text x="90" y="122" fill="#172b2b" font-size="21">x₁</text>
    <text x="90" y="186" fill="#172b2b" font-size="21">x₂</text>
    <path d="M130 115 L260 143 M130 179 L260 151" fill="none" stroke="#176d68" stroke-width="3"/>
    <text x="194" y="107" fill="#536765" font-size="15">weight 1</text>
    <text x="194" y="205" fill="#536765" font-size="15">weight 1</text>
    <circle cx="320" cy="147" r="60" fill="#fff1e8" stroke="#d9684e" stroke-width="3"/>
    <text x="320" y="140" fill="#172b2b" font-size="27">x₁ + x₂</text>
    <text x="320" y="169" fill="#536765" font-size="15">SUM</text>
    <path d="M380 147 L475 147" stroke="#176d68" stroke-width="3"/>
    <path d="M463 140 L475 147 L463 154" fill="none" stroke="#176d68" stroke-width="3"/>
    <rect x="475" y="100" width="180" height="94" rx="3" fill="#173433"/>
    <text x="565" y="137" fill="#fff" font-size="19">Compare with</text>
    <text x="565" y="166" fill="#f6a770" font-size="20" font-weight="700">threshold θ</text>
    <path d="M655 147 L740 147" stroke="#176d68" stroke-width="3"/>
    <path d="M728 140 L740 147 L728 154" fill="none" stroke="#176d68" stroke-width="3"/>
    <rect x="740" y="103" width="120" height="88" rx="3" fill="#fff" stroke="#9dbdb5" stroke-width="2"/>
    <text x="800" y="141" fill="#176d68" font-size="18" font-weight="700">OUTPUT</text>
    <text x="800" y="169" fill="#172b2b" font-size="20">0 or 1</text>
  </g>
</svg>
