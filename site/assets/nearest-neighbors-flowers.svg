<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc">
  <title id="title">A three-neighbor vote for a new flower</title>
  <desc id="desc">Flowers are plotted by petal length and width. Dashed lines connect the new flower to its three closest labeled flowers: two of Species A and one of Species B. The vote predicts Species A.</desc>
  <rect width="680" height="390" fill="#f6faf8"/>
  <g font-family="sans-serif" font-size="17" fill="#172b2b">
    <circle cx="155" cy="34" r="9" fill="#176d68"/><text x="174" y="40">Species A</text>
    <rect x="318" y="25" width="18" height="18" rx="2" fill="#d9684e"/><text x="346" y="40">Species B</text>
    <path d="M512 25 525 38 512 51 499 38Z" fill="#172b2b"/><text x="538" y="43">New flower</text>
  </g>
  <path d="M80 65V290H600" fill="none" stroke="#526864" stroke-width="2"/>
  <g stroke="#cbdcd8" stroke-width="1"><path d="M80 130H600M80 205H600M200 65V290M340 65V290M480 65V290"/></g>
  <circle cx="300" cy="195" r="64" fill="#e9f3ef" stroke="#176d68" stroke-width="2" stroke-dasharray="6 5"/>
  <g stroke="#526864" stroke-width="2" stroke-dasharray="4 4"><path d="M300 195 270 165M300 195 257 222M300 195 336 219"/></g>
  <g fill="#176d68" stroke="#fff" stroke-width="3">
    <circle cx="170" cy="240" r="10"/><circle cx="190" cy="185" r="10"/><circle cx="270" cy="165" r="10"/><circle cx="257" cy="222" r="10"/>
  </g>
  <g fill="#d9684e" stroke="#fff" stroke-width="3">
    <rect x="326" y="209" width="20" height="20" rx="2"/><rect x="430" y="95" width="20" height="20" rx="2"/><rect x="450" y="145" width="20" height="20" rx="2"/>
  </g>
  <path d="M300 181 314 195 300 209 286 195Z" fill="#172b2b" stroke="#fff" stroke-width="3"/>
  <g font-family="sans-serif" fill="#172b2b">
    <text x="316" y="189" font-size="16" font-weight="700">new</text>
    <text x="257" y="318" font-size="17">Petal length →</text>
    <text x="30" y="208" transform="rotate(-90 30 208)" font-size="17">Petal width →</text>
    <text x="87" y="360" font-size="18" font-weight="700">3 nearest: A + A + B  →  predict A</text>
  </g>
</svg>
