<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" role="img" aria-labelledby="title description">
  <title id="title">The parts of a Turing machine</title>
  <desc id="description">A tape of cells stores symbols. A head points at one cell. A rule uses the current state and the read symbol to choose what to write, where to move, and the next state.</desc>
  <rect width="920" height="270" fill="#f3f8f6"/>
  <text x="40" y="42" fill="#176d68" font-family="Arial,sans-serif" font-size="18" font-weight="700">TAPE / MEMORY</text>
  <g fill="#fff" stroke="#9dbdb5" stroke-width="2">
    <rect x="40" y="68" width="100" height="82"/><rect x="140" y="68" width="100" height="82"/>
    <rect x="240" y="68" width="100" height="82"/><rect x="340" y="68" width="100" height="82"/>
    <rect x="440" y="68" width="100" height="82"/><rect x="540" y="68" width="100" height="82"/>
    <rect x="640" y="68" width="100" height="82"/><rect x="740" y="68" width="100" height="82"/>
  </g>
  <rect x="40" y="68" width="100" height="82" fill="#fff1e8" stroke="#d9684e" stroke-width="4"/>
  <g fill="#172b2b" font-family="Arial,sans-serif" font-size="29" text-anchor="middle">
    <text x="90" y="120">1</text><text x="190" y="120">0</text><text x="290" y="120">1</text>
    <text x="390" y="120">0</text><text x="490" y="120">□</text><text x="590" y="120">□</text>
    <text x="690" y="120">□</text><text x="790" y="120">□</text>
  </g>
  <path d="M90 174 L90 153" stroke="#d9684e" stroke-width="4"/>
  <path d="M83 162 L90 152 L97 162" fill="none" stroke="#d9684e" stroke-width="4"/>
  <text x="90" y="196" fill="#ac4a38" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">READ / WRITE HEAD</text>
  <rect x="40" y="217" width="840" height="39" rx="3" fill="#173433"/>
  <text x="60" y="243" fill="#fff" font-family="Arial,sans-serif" font-size="16">State + symbol read</text>
  <text x="276" y="243" fill="#f6a770" font-family="Arial,sans-serif" font-size="22">→</text>
  <text x="326" y="243" fill="#fff" font-family="Arial,sans-serif" font-size="16">Rule: write a symbol, move, enter the next state</text>
</svg>
